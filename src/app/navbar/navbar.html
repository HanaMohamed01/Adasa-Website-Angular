<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <div class="d-flex">
      <div>
        <img
          src="logo.png"
          class="mt-2"
          width="50px"
          height="50px"
          alt="logo"
        />
      </div>
      <div class="d-flex flex-column">
        <a class="navbar-brand navTitle" href="#">عدسة</a>
        <span class="small me-3" style="font-size: 12px">
          عالم التصوير الفوتوغرافي</span
        >
      </div>
    </div>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mb-2 mb-lg-0 p-2 rounded-pill">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active-link rounded-pill"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLink="/"
            >الرئيسية</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active-link rounded-pill"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLink="/bloghome"
            >المدونة</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active-link rounded-pill"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLink="/aboutmain"
            >من نحن</a
          >
        </li>
      </ul>
      <div class="nav-actions d-flex align-items-center">
        <form class="navbar-search" (ngSubmit)="submitSearch()">
          <button
            type="button"
            class="search-toggle"
            [class.active]="searchOpen"
            (click)="searchOpen = !searchOpen"
            aria-label="فتح البحث"
          >
            <i class="fa-search fa-solid"></i>
          </button>
          @if (searchOpen) {
            <input
              type="search"
              name="navbarSearch"
              [(ngModel)]="searchQuery"
              (input)="searchAsYouType()"
              placeholder="ابحث في المقالات..."
              aria-label="البحث في المقالات"
              autofocus
            />
          }
        </form>
        <button
          class="btn rounded-pill start-reading"
          routerLink="/bloghome"
          routerLinkActive="blog-page-button"
        >
          ابدأ القراءة
        </button>
      </div>
    </div>
  </div>
</nav>
